<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My WEB</title>
  <style>
      .form-container {
        width: 100vw;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      form {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 15px;
      }
      .form-input {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      #user-name-input, #user-type-input, #password-input, #submit-input {
        width: 350px;
        height: 25px;
        padding: 20px;
      }
      label {
        margin: 40px;
      }

       input[type="submit"] {
        background-color: turquoise;
       }
       input[type="submit"]:hover {
        cursor: pointer;
        background-color: darkcyan;
       }
       .input-error{
        border-color:red ;
       }
       .error-message {
        color: red;
       }
  </style>
</head>
<body>
<div class="form-container">
 <h1>Registration form</h1>
<form>
  <div class="form-input" id="name-input-container">
    <label for="user-name-input">Enter your name</label>
    <input id="user-name-input" type="text" placeholder="Name">
  </div>
    <div class="form-input">
      <label for="password-input">Enter your password</label>
      <input id="password-input" type="password" placeholder="Password">
    </div>
    <div class="form-input">
      <label for="user-type-input">Select your role</label>
       <select id="user-type-input">
        <option value="0">Admin</option>
        <option value="1">Moderator</option>
        <option value="2">User</option>
    </select>
    </div>
</form>

 <button id="submit-input">Submit button</button>


</div>
<script type="text/javascript">
       const nameInput = document.querySelector("#user-name-input");
  const container = document.querySelector("#name-input-container");

  let errorElement = null; 

  nameInput.addEventListener("blur", () => {
    if (errorElement) {
      errorElement.remove();
      errorElement = null;
    }

    const value = nameInput.value.trim();

    if (!value || value.length < 4) {
      nameInput.classList.add("input-error");

      errorElement = document.createElement("p");
      errorElement.className = "error-message";
      errorElement.textContent = "Name field is required";

      container.appendChild(errorElement);
    } else {
      nameInput.classList.remove("input-error");
    }
  });

  nameInput.addEventListener("focus", () => {
    nameInput.classList.remove("input-error");
    if (errorElement) {
      errorElement.remove();
      errorElement = null;
    }
  });


</script>
</body>
</html>
